name: Feature request
description: Suggest an improvement for the local development workflow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local development pain should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Dev Cockpit do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Project scanning
        - Commands and processes
        - Ports and status detection
        - Logs
        - AI context
        - UI / UX
        - Packaging
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Additional context
