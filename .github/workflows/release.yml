name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows desktop release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm release:check

      - name: Build Windows installers
        run: pnpm --filter @local-dev-cockpit/desktop dist:win

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Dev Cockpit ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            apps/desktop/release/Dev-Cockpit-*-win-x64.exe
            apps/desktop/release/*.blockmap
